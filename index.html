<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#dceee5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="习题簿">
  <title>习题簿 · 离线版</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon.png">
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <header class="top"><div><strong>习题簿</strong><small>iPhone 离线版</small></div><span id="save-status">正在打开…</span></header>

    <button data-page="home">首页</button>
    <button data-page="setup">练习</button>
    <button data-page="wrong">错题</button>
    <button data-page="star">收藏</button>
    <button data-page="data">数据</button>

  <input id="import-file" type="file" accept=".json,application/json" hidden>
  <div id="message" role="alert" hidden></div>

</html>
